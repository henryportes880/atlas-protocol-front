<div class="login-page">
  <div class="login-art" aria-hidden="true">
    <img src="/images/atlas-hero.png" alt="" fetchpriority="high" decoding="async" />
  </div>
  <div class="login-fade" aria-hidden="true"></div>

  <div class="login-frame">
    <header class="login-brand" aria-label="Atlas Protocol">
      <app-atlas-brand [compact]="true" />
    </header>

    <main class="login-main">
      <section class="login-panel" aria-labelledby="login-title">
        <header class="login-header">
          <span class="login-eyebrow">Acesso ao Atlas</span>
          <h1 id="login-title">Bem-vindo de volta</h1>
          <p>Acompanhe sua jornada e sua evolução com clareza.</p>
        </header>

        <form class="login-form" (ngSubmit)="submit()" [attr.aria-busy]="loading">
          <label class="ds-field" for="login-email">
            <span class="ds-field__label">E-mail</span>
            <input
              class="ds-control login-control"
              id="login-email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="voce@email.com"
              autocomplete="email"
              maxlength="254"
              required
            />
          </label>

          <label class="ds-field" for="login-password">
            <span class="ds-field__label">Senha</span>
            <span class="ds-input-wrap">
              <input
                class="ds-control login-control"
                id="login-password"
                [type]="showPassword ? 'text' : 'password'"
                name="password"
                [(ngModel)]="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                maxlength="72"
                required
              />
              <button
                type="button"
                class="ds-input-action"
                (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
                [attr.aria-pressed]="showPassword"
              >
                <app-atlas-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="18" />
              </button>
            </span>
          </label>

          <div class="ds-alert ds-alert--danger" role="alert" aria-live="polite" *ngIf="error">
            <app-atlas-icon name="info" [size]="18" />
            <span>{{ error }}</span>
          </div>

          <button class="ds-button ds-button--primary login-submit" type="submit" [disabled]="loading">
            <span class="loading-dot" *ngIf="loading" aria-hidden="true"></span>
            <span>{{ loading ? 'Entrando...' : 'Entrar no Atlas' }}</span>
            <app-atlas-icon *ngIf="!loading" name="arrow-right" [size]="18" />
          </button>
        </form>

        <p class="login-switch">Ainda não possui conta? <a routerLink="/register">Criar conta</a></p>

        <p class="login-trust">
          <app-atlas-icon name="shield" [size]="14" />
          <span>Sua sessão permanece protegida durante o acesso.</span>
        </p>
      </section>
    </main>
  </div>
</div>
