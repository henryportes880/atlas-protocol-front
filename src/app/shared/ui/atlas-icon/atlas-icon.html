<svg
  class="atlas-icon"
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
  xmlns="http://www.w3.org/2000/svg"
>
  @switch (name()) {
    @case ('home') {
      <path d="M3.5 10.75 12 3.8l8.5 6.95" />
      <path d="M5.5 9.4v10.1h13V9.4M9.25 19.5v-5.75h5.5v5.75" />
    }
    @case ('flask') {
      <path d="M9 3h6M10 3v6.15l-5.12 8.4A2.25 2.25 0 0 0 6.8 21h10.4a2.25 2.25 0 0 0 1.92-3.45L14 9.15V3" />
      <path d="M7.1 14h9.8" />
    }
    @case ('activity') {
      <path d="M3 12h4l2.2-5.25 4.25 10.5L15.8 12H21" />
    }
    @case ('clipboard') {
      <rect x="5.25" y="4.75" width="13.5" height="16" rx="2" />
      <path d="M9 5V3.75h6V5a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 5ZM8.75 11h6.5M8.75 15h6.5" />
    }
    @case ('chart') {
      <path d="M4 4v16h16" />
      <path d="m7 16 3.5-4 3 2.25L19 8" />
      <circle cx="7" cy="16" r="0.75" fill="currentColor" stroke="none" />
      <circle cx="10.5" cy="12" r="0.75" fill="currentColor" stroke="none" />
      <circle cx="13.5" cy="14.25" r="0.75" fill="currentColor" stroke="none" />
      <circle cx="19" cy="8" r="0.75" fill="currentColor" stroke="none" />
    }
    @case ('menu') {
      <path d="M4 7h16M4 12h16M4 17h16" />
    }
    @case ('close') {
      <path d="m5 5 14 14M19 5 5 19" />
    }
    @case ('logout') {
      <path d="M10 4H5.75A1.75 1.75 0 0 0 4 5.75v12.5C4 19.22 4.78 20 5.75 20H10" />
      <path d="M14.5 8.5 18 12l-3.5 3.5M9 12h9" />
    }
    @case ('bell') {
      <path d="M18 9.5a6 6 0 0 0-12 0c0 7-2.5 7-2.5 7h17S18 16.5 18 9.5Z" />
      <path d="M9.75 20h4.5" />
    }
    @case ('arrow-right') {
      <path d="M5 12h14M14 7l5 5-5 5" />
    }
    @case ('calendar') {
      <rect x="3.5" y="5.5" width="17" height="15" rx="2" />
      <path d="M7.5 3.5v4M16.5 3.5v4M3.5 10h17" />
    }
    @case ('check') {
      <path d="m4.5 12.5 4.75 4.75L19.5 7" />
    }
    @case ('shield') {
      <path d="M12 3 5 5.75v5.4c0 4.55 2.85 7.9 7 9.85 4.15-1.95 7-5.3 7-9.85v-5.4L12 3Z" />
      <path d="m8.8 12 2.15 2.15 4.45-4.45" />
    }
    @case ('user') {
      <circle cx="12" cy="8" r="3.5" />
      <path d="M5 20c.65-4 3.15-6 7-6s6.35 2 7 6" />
    }
    @case ('chevron-down') {
      <path d="m6 9 6 6 6-6" />
    }
    @case ('eye') {
      <path d="M2.75 12s3.4-6 9.25-6 9.25 6 9.25 6-3.4 6-9.25 6S2.75 12 2.75 12Z" />
      <circle cx="12" cy="12" r="2.75" />
    }
    @case ('eye-off') {
      <path d="M3 3 21 21" />
      <path d="M9.85 6.25A9.7 9.7 0 0 1 12 6c5.85 0 9.25 6 9.25 6a13.7 13.7 0 0 1-2.2 2.9M14.15 17.75A9.7 9.7 0 0 1 12 18c-5.85 0-9.25-6-9.25-6a13.7 13.7 0 0 1 2.2-2.9" />
      <path d="M10.05 10.05a2.75 2.75 0 0 0 3.9 3.9" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11v5M12 8h.01" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3.5 2" />
    }
  }
</svg>
